services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: school_attendance
      MYSQL_USER: attendance_user
      MYSQL_PASSWORD: YourStrongPassword123!
    ports:
      - "3307:3306" # Using your preferred port 3307
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build: ./backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: attendance_user
      DB_PASSWORD: YourStrongPassword123!
      DB_NAME: school_attendance
      JWT_SECRET: your_super_secret_jwt_key_that_is_long_and_random
      FACE_SERVICE_URL: http://face-service:5001
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  face-service:
    build: ./face-recognition-service
    restart: always
    ports:
      - "5001:5001"
    # --- This is the only added section ---
    environment:
      DB_HOST: db
      DB_USER: attendance_user
      DB_PASSWORD: YourStrongPassword123!
      DB_NAME: school_attendance
    depends_on:
      db:
        condition: service_healthy
    # --- End of added section ---

volumes:
  mysql-data: